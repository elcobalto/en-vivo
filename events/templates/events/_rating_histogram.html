{% load event_extras %}
{% if total %}
<div class="rating-hist">
  <div class="d-flex justify-content-between align-items-end mb-1">
    <span class="section-title border-0 p-0">{{ title }}</span>
    <span class="small text-body-secondary text-nowrap">{{ total }}{% if show_average %} · <span title="Average rating">{{ average|avg_stars }} avg</span>{% endif %}</span>
  </div>
  <div class="rating-bars" role="img" aria-label="Ratings: {% for b in bars %}{{ b.label }} {{ b.count }}{% if not forloop.last %}, {% endif %}{% endfor %}">
    {% for b in bars %}
      <div class="rating-bar" title="{{ b.count }} × {{ b.label }}">
        <div style="height: {{ b.height }}%{% if b.count %};min-height:2px{% endif %}"></div>
      </div>
    {% endfor %}
  </div>
  <div class="d-flex justify-content-between mt-1" aria-hidden="true">
    <span class="stars small">½</span><span class="stars small">★★★★★</span>
  </div>
</div>
{% endif %}
