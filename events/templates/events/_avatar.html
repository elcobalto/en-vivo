{% if url %}<img class="rounded-circle flex-shrink-0" src="{{ url }}" alt="" width="{{ size }}" height="{{ size }}" style="object-fit:cover" referrerpolicy="no-referrer" />{% else %}<span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0 fw-bold" style="width:{{ size }}px;height:{{ size }}px;font-size:{{ font }}px;background:#456;color:#def" aria-hidden="true">{{ initial }}</span>{% endif %}
