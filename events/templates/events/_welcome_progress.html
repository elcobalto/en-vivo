{% load i18n %}{% comment %}Sign-up progress: “Step 2 of 5” and a bar.{% endcomment %}
<div class="d-flex justify-content-between align-items-baseline small text-body-secondary mb-1">
  <span class="text-uppercase">{% translate "Welcome to En Vivo" %}</span>
  <span>{% blocktranslate %}Step {{ number }} of {{ total }}{% endblocktranslate %}</span>
</div>
<div class="progress mb-4" role="progressbar" aria-label="{% translate 'Sign-up progress' %}" aria-valuenow="{{ number }}" aria-valuemin="1" aria-valuemax="{{ total }}" style="height: .4rem">
  <div class="progress-bar bg-success" style="width: {{ percent }}%"></div>
</div>
